*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;min-height:100vh;background-color:var(--wood1);
 background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),linear-gradient(90deg,var(--wood2),var(--wood1) 20%,var(--wood3) 45%,var(--wood1) 70%,var(--wood2))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--wood2)}
.emblem{display:inline-block;background:center/contain no-repeat;background-image:var(--emb)}
.top{background:linear-gradient(180deg,#4A2A14,#33190A);border-bottom:3px solid #1E0D04;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.topin{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.plate{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border-radius:10px;text-decoration:none;color:#3A2808;background:linear-gradient(160deg,var(--brass1),var(--brass2) 55%,var(--brass3));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.5)}
.plate .emblem{width:38px;height:38px;border-radius:50%;background-color:#FBF6E9}
.plate b{display:block;font-family:"Noto Serif KR",serif;font-weight:800;font-size:16px;line-height:1.1}
.plate small{display:block;font-size:10px;letter-spacing:.08em;font-weight:700}
.credit{color:var(--woodInk);font-size:13px;opacity:.9}
.key{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:#2A1E12;background:linear-gradient(180deg,#FFFDF6,#E8DFC9);box-shadow:0 1px 0 #fff inset,0 -3px 0 rgba(0,0,0,.18) inset,0 4px 0 #9C8B6C,0 6px 10px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #fff inset,0 1px 0 #9C8B6C,0 2px 4px rgba(0,0,0,.35)}
.key.green{color:#fff;background:linear-gradient(180deg,#5FB76E,#2F7D3F);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 -3px 0 rgba(0,0,0,.25) inset,0 4px 0 #1F5229,0 6px 12px rgba(0,0,0,.4)}
.key.wood{color:var(--woodInk);background:linear-gradient(180deg,#A06A3E,#6E4222);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -3px 0 rgba(0,0,0,.3) inset,0 4px 0 #3D2210,0 6px 12px rgba(0,0,0,.45)}
.key:disabled{opacity:.5;cursor:not-allowed}
.key:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.opt:focus-within{outline:3px solid #FFD54A;outline-offset:3px}
main{max-width:1100px;margin:0 auto;padding:26px 16px 50px}
.paper{background:var(--paper);border-radius:6px;padding:26px 28px;box-shadow:var(--shadow);position:relative}
h1.t{font-family:"Noto Serif KR",serif;font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1.15;margin:0 0 6px}
.hand{font-family:"Nanum Pen Script",cursive;font-size:30px;color:var(--red);line-height:1.1}
.sticky{position:relative;background:#FFF59D;padding:18px 16px 14px;box-shadow:0 8px 12px rgba(0,0,0,.2);transform:rotate(-.5deg)}
.sticky::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:22px;margin-left:-40px;background:rgba(255,255,255,.6);box-shadow:0 1px 2px rgba(0,0,0,.15)}
footer{max-width:1100px;margin:0 auto;padding:0 16px 40px;color:var(--woodInk);font-size:13px;opacity:.9}
[hidden]{display:none!important}
